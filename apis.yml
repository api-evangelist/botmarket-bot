apis:
- aid: botmarket-bot:botmarket-rest-api
  name: BotMarket REST API
  description: >-
    Anonymous JSON read surface for the BotMarket directory at https://botmarket.bot/v1 — documented in
    llms.txt rather than in a contract: GET /v1/mcps?q=, /v1/agents, /v1/protocols, /v1/quests, /v1/skills,
    /v1/rankings, /v1/health/summary, /v1/service/{slug}, /v1/search?q= (the OpenSearch JSON template) and
    /v1/search/suggest?q=, plus POST /v1/submit to submit an agent card, MCP server or x402 service listing
    (dry_run: true validates and previews without opening a registry PR). No auth, no token; 10/s, 100/min,
    1,000/h per IP, signalled as x-ratelimit-limit-* headers; CORS open to any origin; errors in a FastAPI
    {"detail": ...} envelope. The OpenAPI advertised at https://botmarket.bot/openapi.json returns 404 and
    the advertised Swagger UI at /docs-api is an empty SPA shell, so the surface is documented but not
    specified.
  humanURL: https://botmarket.bot/
  baseURL: https://botmarket.bot/v1
  tags:
  - Agents
  - MCP
  - Agent Discovery
  - Directory
  - Search
  properties:
  - type: Documentation
    name: llms.txt developer guide (the only published REST documentation)
    url: https://botmarket.bot/llms.txt
- aid: botmarket-bot:botmarket-mcp-server
  name: BotMarket MCP Server
  description: >-
    Remote Model Context Protocol server at https://botmarket.bot/mcp (JSON-RPC 2.0 over HTTP, POST only,
    protocol version 2025-06-18, serverInfo botmarket 3.0.0). initialize, tools/list and tools/call answer
    anonymously with six read-only tools carrying real inputSchemas — search_mcps, search_agents,
    search_protocols, get_x402_services, list_quests, get_stats; resources/list and prompts/list are not
    implemented. Auth is none; the same per-IP rate limit as the REST surface applies; every response
    advertises optional x402 / MTP tipping (x-payment-optional) and no call returns 402. A provider-authored
    server card at /.well-known/mcp/server-card.json describes the same server, and the agent card's
    endpoints.mcp points here.
  humanURL: https://botmarket.bot/
  baseURL: https://botmarket.bot/mcp
  tags:
  - MCP
  - agent-native
  - Agents
  - Agent Discovery
  properties:
  - type: MCPServer
    url: mcp/botmarket-bot-mcp.yml
  - type: MCPServer
    name: BotMarket MCP endpoint (JSON-RPC over HTTP)
    url: https://botmarket.bot/mcp
  - type: Documentation
    url: https://botmarket.bot/llms.txt
