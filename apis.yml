aid: botmarket-bot
name: KOA Labs
description: >-
  KOA Labs is a one-person "solo + AI" software studio in Mexico City (koalabs.ai) that builds open
  protocols, registries and directories, and BotMarket (botmarket.bot) is its free, non-profit marketplace and
  registry for AI agents and MCP servers — 115,065 MCP servers, 3,615 A2A-style agents and 25 agent and
  payment protocols re-gathered hourly from public catalogs (Glama, mcp.so, Smithery, the Official MCP
  Registry, Hugging Face, Docker, x402 Bazaar) with every record credited to its source. The surface is
  anonymous and rate-limited per IP (10/s, 100/min, 1,000/h) with no signup and no token: a documented but
  unspecified REST read surface at https://botmarket.bot/v1 plus POST /v1/submit with a dry_run flag, and a
  live remote MCP server at https://botmarket.bot/mcp (protocol 2025-06-18, six read-only tools with real
  inputSchemas). Discovery is published as llms.txt, an OpenAI ai-plugin.json, an OpenSearch description, an
  MCP server card and an agent card at /.well-known/agent-card.json that is served and owned but not A2A
  conformant (capabilities is an array, no protocolVersion, no skills, no A2A endpoint). The OpenAPI both
  llms.txt and ai-plugin.json advertise at /openapi.json is not served (404), so no machine-readable REST
  contract exists. Optional tipping over x402 / MTP is advertised in a response header; nothing is paywalled.
