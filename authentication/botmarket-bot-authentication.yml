  headline: >-
    No authentication of any kind. BotMarket's REST surface (/v1), MCP server (/mcp) and submission endpoint
    (POST /v1/submit) are anonymous by design — "Free for bots. No signup." and "10 req/sec, 100/min,
    1000/hour per IP. Free. No token required." (llms.txt). The MCP server card declares "auth":"none", the
    ai-plugin manifest declares auth {type: none}, and every live probe (initialize, tools/list, tools/call
    get_stats, GET /v1/mcps, /v1/agents, /v1/protocols, /v1/quests) succeeded with no credential. Access
    control is per-IP rate limiting, not identity. No OAuth, no OIDC, no API keys, no bearer tokens, and no
    discovery documents on the host (/.well-known/openid-configuration, /oauth-authorization-server and
    /oauth-protected-resource all 404).
