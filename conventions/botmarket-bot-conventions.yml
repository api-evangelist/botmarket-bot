payment_signaling:
  headers: ['x-payment-optional: x402,mtp', 'x-tip-url: https://botmarket.bot/payments']
  note: Optional tipping advertised on every response; no 402 was returned.
cors:
  access_control_allow_origin: '*'
  access_control_allow_methods: 'GET, POST, HEAD, OPTIONS'
  access_control_max_age: 600
  observed: OPTIONS https://botmarket.bot/v1/mcps with an Origin header, 2026-09-19
  note: Browser and in-page agents can call the API cross-origin without a proxy.
caching:
  cache_control: 'public, max-age=60'
  observed_on: /v1/* and /mcp responses
  note: The catalog is "mirrored hourly" (homepage) and responses are cacheable for 60 seconds.
