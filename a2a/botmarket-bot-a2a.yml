  canonical: true
  host: botmarket.bot
  note: >-
    Served from the apex host botmarket.bot, which is also the REST base (https://botmarket.bot/v1) and the
    MCP server host (https://botmarket.bot/mcp) — one Caddy origin behind Cloudflare. The legacy
    /.well-known/agent.json returns the backend's real JSON 404 ({"detail":"Not Found"}, 22 bytes,
    application/json), not an SPA shell, and a negative-control path
    (/.well-known/apievangelist-negative-control-7f3a9c.json) also 404s, so the 200 on agent-card.json is a
    served document and not a catch-all. www.botmarket.bot cannot serve anything: Cloudflare answers 525
