  security: null
  documentation_url: null
  icon_url: null
  skill_count: 0
  skills: null
  note: >-
    The card's url is the website root, not an A2A endpoint, and the card names no A2A JSON-RPC URL at all.
    What it publishes is a discovery manifest that points an agent at a REST base and an MCP server. The
    "skills" the site advertises (https://botmarket.bot/skills, /v1/skills) are the skills of the 3,615
    THIRD-PARTY agents BotMarket indexes, not skills of BotMarket itself, and none are declared in the card.
conformance:
  spec: A2A 1.0.0
  grade: flavored
  protocol_version: null
  preferred_transport: null
  hard_checks:
    capabilities_is_object: false
    protocol_version_present: false
    skills_is_array: false
  optional_fields:
    default_input_modes: false
    default_output_modes: false
    preferred_transport: false
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks and fails all three. capabilities is an ARRAY of four strings
    (["search","directory","quests","mcp-server"]) where the spec defines an AgentCapabilities OBJECT
    (streaming, pushNotifications, stateTransitionHistory, extensions). protocolVersion is absent; the card
    instead carries a non-A2A field schemaVersion "0.3". skills is absent entirely — no array, empty or
    otherwise — and version is absent. It is served at the canonical path with the right content type and is
    plainly this provider's own document, but a reader written against A2A 0.3.0 or 1.0.0 cannot discover a
    transport, an endpoint, an input mode or a single skill from it. Recorded as flavored: present, owned,
    not conformant.
  deviations:
  - field: capabilities
    observed: array of strings
    expected: AgentCapabilities object
    note: The single most common flavoring defect in the catalog; here the array is a feature list, not a capabilities declaration.
  - field: protocolVersion
    observed: absent (schemaVersion "0.3" in its place)
    expected: string, e.g. "0.3.0"
    note: schemaVersion is not an A2A field; the value "0.3" suggests the author meant A2A 0.3 but the key is wrong.
  - field: skills
    observed: absent
    expected: array of AgentSkill
    note: No skills declared. The marketplace's /skills surface describes other agents' skills.
  - field: version
    observed: absent
    expected: string
  - field: url
    observed: https://botmarket.bot (website root)
    expected: the A2A service endpoint URL
    note: >-
      No A2A JSON-RPC endpoint exists on the card. The non-standard endpoints object names a REST base and an
      MCP server instead, so the card functions as a pointer to MCP rather than as an A2A interface
      description. The site's own copy ("MCP + A2A native") is not borne out by the card for the A2A half.
  - field: endpoints
    observed: '{rest: https://botmarket.bot/v1, mcp: https://botmarket.bot/mcp}'
    expected: not an A2A field (1.0.0 uses supportedInterfaces[]; 0.3.0 uses url + additionalInterfaces[])
  - field: preferredTransport / defaultInputModes / defaultOutputModes / securitySchemes / security / documentationUrl / iconUrl / signatures
    observed: all absent
surface_relationship:
  note: >-
    BotMarket publishes two live machine surfaces on one host and the agent card is a signpost to both, not a
    third surface. MCP: six tools at https://botmarket.bot/mcp (search_mcps, search_agents, search_protocols,
    get_x402_services, list_quests, get_stats), anonymous, rate-limited per IP (see mcp/botmarket-bot-mcp.yml).
    REST: a documented but UNSPECIFIED /v1 read surface plus POST /v1/submit — llms.txt and ai-plugin.json both
    advertise an OpenAPI at https://botmarket.bot/openapi.json, which returns a 0-byte 404, and the Swagger UI
    advertised at /docs-api is an empty SvelteKit shell. There is no A2A endpoint to relate the card to.
